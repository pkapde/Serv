[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cx-semantic-mcp"
version = "0.1.0"
description = "Governed CX analytics through MCP, Teradata and Snowflake"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "mcp==1.30.0",
  "pydantic>=2.11,<3", "pydantic-settings>=2.5,<3", "PyYAML>=6,<7",
  "sqlalchemy>=2,<3", "psycopg[binary]>=3,<4", "httpx>=0.28,<1",
  "metricflow==0.213.0", "dbt-metricflow==0.15.0", "dbt-snowflake==1.12.1",
  "sqlglot==29.0.1", "teradatasql==20.0.0.70", "tiktoken>=0.9,<1",
  "duckdb>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["semantic_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
